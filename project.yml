name: GMApplePlayer

options:
  bundleIdPrefix: com.gm.appleplayer
  deploymentTarget:
    macOS: "12.0"
    iOS: "15.0"
    tvOS: "15.0"
  createIntermediateGroups: true

# Local Swift package that bundles the FFmpeg xcframework + remux engine + UI.
packages:
  GMPlayerKit:
    path: Packages/GMPlayerKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # The app is unsandboxed on macOS so it can open files anywhere the user
    # picks (the acceptance file lives in ~/Movies). Toggle on for App Store.
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # ---------------------------------------------------------------- macOS
  GMApplePlayer-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/GMApplePlayer
      - path: Resources/macOS/Assets.xcassets
    dependencies:
      - package: GMPlayerKit
        product: GMPlayerKit
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: GMPlayer
        CFBundleName: GMPlayer
        LSMinimumSystemVersion: "12.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gm.appleplayer.mac
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---------------------------------------------------------------- iOS
  GMApplePlayer-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/GMApplePlayer
      - path: Resources/iOS/Assets.xcassets
    dependencies:
      - package: GMPlayerKit
        product: GMPlayerKit
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: GMPlayer
        CFBundleName: GMPlayer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gm.appleplayer.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ---------------------------------------------------------------- tvOS
  GMApplePlayer-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources/GMApplePlayer
      - path: Resources/tvOS/Assets.xcassets
    dependencies:
      - package: GMPlayerKit
        product: GMPlayerKit
    info:
      path: App/Info-tvOS.plist
      properties:
        CFBundleDisplayName: GMPlayer
        CFBundleName: GMPlayer
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gm.appleplayer.tvos
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"

schemes:
  GMApplePlayer-macOS:
    build:
      targets: { GMApplePlayer-macOS: all }
    run:
      config: Debug
  GMApplePlayer-iOS:
    build:
      targets: { GMApplePlayer-iOS: all }
    run:
      config: Debug
  GMApplePlayer-tvOS:
    build:
      targets: { GMApplePlayer-tvOS: all }
    run:
      config: Debug
